[project]
name = "jijin-backend"
version = "0.1.0"
description = "基金做 T 助手后端：真实行情 + JSON 本地账本"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27,<0.29",
    "beautifulsoup4>=4.12,<5",
    "pydantic>=2.9,<3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
